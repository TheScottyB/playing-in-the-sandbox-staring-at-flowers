# Shared connection flow with auto-recovery for dev client Metro discovery
appId: com.djscottyb.playinginthesandoxlookingatflowers
---
- launchApp:
    clearState: false

# Check if the local dev server is auto-discovered on screen.
# If it is not visible, recover by opening the app deep link directly.
- runFlow:
    when:
      notVisible: "http://localhost:8081"
    commands:
      - openLink: "staring-at-flowers://?disableOnboarding=1"
      - tapOn:
          text: "Open"
          optional: true

- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"
