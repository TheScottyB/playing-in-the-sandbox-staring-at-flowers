# Geolocation Fallback Smoke Test: denies location access and verifies fallback/default region loads
appId: com.djscottyb.playinginthesandoxlookingatflowers
---
- launchApp:
    permissions:
      location: deny
- openLink: "staring-at-flowers://"
- extendedWaitUntil:
    visible: ".*TAP TO READ.*"
    timeout: 15000
- assertVisible: "← Yesterday"
