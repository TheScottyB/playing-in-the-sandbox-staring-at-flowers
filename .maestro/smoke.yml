# Smoke test: app launches and the daily flower screen resolves.
#
# App ID:
#   Dev client / production (iOS & Android): com.djscottyb.playinginthesandoxlookingatflowers
appId: com.djscottyb.playinginthesandoxlookingatflowers
---
- runFlow: subflows/connect.yml

# Wait for the screen to resolve — we expect the daily flower card to load.
- extendedWaitUntil:
    visible: ".*TAP TO READ.*"
    timeout: 20000

# Verify nav is present
- assertVisible: "← Yesterday"
